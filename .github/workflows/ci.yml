name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  # publish.yml runs this whole workflow for the tagged commit before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        opentelemetry: [lowest, latest]
    name: Node ${{ matrix.node }} / OpenTelemetry ${{ matrix.opentelemetry }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install latest supported OpenTelemetry versions
        if: matrix.opentelemetry == 'latest'
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts
          '@opentelemetry/api@>=1.10.0 <1.11.0'
          '@opentelemetry/sdk-metrics@^3.0.0'
          '@opentelemetry/exporter-prometheus@>=0.300.0 <0.302.0'
          '@opentelemetry/exporter-metrics-otlp-http@>=0.300.0 <0.302.0'
          '@opentelemetry/resources@^3.0.0'
          '@opentelemetry/core@^3.0.0'
      - run: npm test
