name: Publish

# Publishes to npm when a version tag, such as v0.1.1, is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # The whole of CI for this commit before anything reaches npm. ci.yml's own push trigger is
  # branches only, so a tag runs it once, here, and the publish waits for it.
  ci:
    uses: ./.github/workflows/ci.yml

  # Installs, builds, tests and packs the release in a job that cannot publish. Only the packed
  # tarball goes on to the publish job.
  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          # A release installs from the lockfile alone, never from a cache.
          package-manager-cache: false
      - name: Check that the tag names the version being published
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      # The registry shows each version's commit as gitHead, and a tarball has no .git, so the
      # commit goes into the packed package.json.
      - name: Write the commit into the package.json being packed
        run: |
          sed -i "1a\\  \"gitHead\": \"$(git rev-parse HEAD)\"," package.json
      - run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/adityareddy-dev-otel-cluster-metrics-*.tgz
          if-no-files-found: error

  # The one job that can publish. It checks out nothing and installs nothing, and npm runs no
  # lifecycle script when it publishes a tarball.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token GitHub issues to this job. Trusted publishing exchanges it for the right to
      # publish, and --provenance signs the provenance statement with it.
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Trusted publishing needs npm 11.5.1 or later and Node 22.14 or later.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
      # Trusted publishing needs no secret. On npmjs.com, in the package's settings under Trusted
      # publishing, choose GitHub Actions with user adityareddy-dev, repository
      # otel-cluster-metrics and workflow filename publish.yml, and tick `npm publish` under
      # Allowed actions.
      #
      # The tarball is named by the tag, so only the version the tag names can go out.
      - run: npm publish "./adityareddy-dev-otel-cluster-metrics-${GITHUB_REF_NAME#v}.tgz" --provenance --access public
