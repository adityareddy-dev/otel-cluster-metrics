# docker compose up, then open http://localhost:3000/d/node-cluster-otel-metrics
services:
  install:
    image: node:24-slim
    working_dir: /app
    command: ["npm", "ci", "--no-audit", "--no-fund"]
    volumes: [".:/app"]
  shop-api:
    image: node:24-slim
    working_dir: /app
    command: ["node", "app.cjs"]
    environment: { MODE: merged }
    volumes: [".:/app:ro"]
    depends_on: { install: { condition: service_completed_successfully } }
  shop-api-stock:
    image: node:24-slim
    working_dir: /app
    command: ["node", "app.cjs"]
    environment: { MODE: stock }
    volumes: [".:/app:ro"]
    depends_on: { install: { condition: service_completed_successfully } }
  load:
    image: node:24-slim
    working_dir: /app
    command: ["node", "load.cjs"]
    environment: { TARGETS: "http://shop-api:8080,http://shop-api-stock:8080" }
    volumes: [".:/app:ro"]
    depends_on: [shop-api, shop-api-stock]
  prometheus:
    image: prom/prometheus:v3.15.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./provisioning.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
      - ./dashboards.yaml:/etc/grafana/provisioning/dashboards/db.yaml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    ports: ["3000:3000"]
